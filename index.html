<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Photo Gallery</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Scrolling header -->
  <header class="site-header">
    <h1 id="gallery-title">Nadar Lau</h1>
    <!-- Segmented control for three modes: Grid, List, Feed -->
    <div class="view-toggle" role="tablist" aria-label="Gallery view mode">
      <button id="btn-grid" class="toggle-btn active" data-text="Grid" aria-pressed="true" aria-label="Grid view">Grid</button>
      <button id="btn-list" class="toggle-btn" data-text="List" aria-pressed="false" aria-label="List view">List</button>
      <button id="btn-feed" class="toggle-btn" data-text="Feed" aria-pressed="false" aria-label="Feed view">Feed</button>
    </div>
  </header>

  <!-- Image gallery with mode-based layout -->
  <main>
    <div class="gallery-container">
      <!-- Gallery wrapper with mode class: .mode-grid, .mode-list, or .mode-feed -->
      <div class="gallery grid mode-grid" id="gallery" aria-busy="true">
        <figure class="item photo-card">
          <div class="skeleton"></div>
          <img src="assets/images/IMG_0718.jpg" alt="Gallery photo by Nadar Lau" loading="lazy" decoding="async" />
          <figcaption>
            <span class="item-number">P:001</span>
            <span class="item-size">1080 × 1440</span>
            <span class="item-year">2025</span>
          </figcaption>
          <!-- Grid mode caption: P:001 format (dynamically populated) -->
          <div class="photo-caption"></div>
        </figure>

  <!-- Lightbox overlay with centered thumbnail strip -->
  <div id="lightbox" class="lightbox hidden" data-lightbox-root>
    <button class="close" id="close-btn" aria-label="Close lightbox">Close</button>
    <button class="nav prev" id="prev-btn" aria-label="Previous image">Left</button>
    <img id="lightbox-img" src="" alt="Enlarged photo" />
    <button class="nav next" id="next-btn" aria-label="Next image">Right</button>
    <!-- Centered thumbnail strip at bottom -->
    <div class="lb-thumbs-wrapper">
      <div class="lb-thumbs" role="tablist" aria-label="Image thumbnails">
        <!-- Thumbnails will be dynamically generated by JavaScript -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
